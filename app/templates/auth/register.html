{% extends "base.html" %}

{% block title %}Register - InternDisha{% endblock %}

{% block content %}
<section class="section" style="background-color: var(--white);">
    <div class="container">
        <div style="max-width: 500px; margin: 0 auto;">
            <h1 class="section-title">Register</h1>
            
            <div class="card">
                <div class="card-body">
                    <form method="POST" action="{{ url_for('auth.register') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        
                        <div class="form-group">
                            <label class="form-label" for="full_name">Full Name</label>
                            <input type="text" class="form-control" id="full_name" name="full_name" required autofocus>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="email">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="password">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                            <small class="form-text">Password must be at least 8 characters long.</small>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="confirm_password">Confirm Password</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                        </div>
                        
                        <div class="form-group">
                            <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
                        </div>
                    </form>
                    
                    <div style="text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-gray);">
                        <p style="margin-bottom: 10px;">Already have an account?</p>
                        <a href="{{ url_for('auth.login') }}" class="btn btn-outline">Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
